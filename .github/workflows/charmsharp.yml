name: Incremental CharmSharp port
on:
  push:
    branches: [charmsharp/incremental-port]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  translation:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: dmorganb/charmsharp
          ref: 0e2e0280f252598f9de48159320be55c3d20d703
          path: compiler
      - run: make -C compiler -j2 test
      - run: python3 charmsharp/test_migration.py --compiler compiler/build/charmsharp
  runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: dmorganb/charmsharp
          ref: 0e2e0280f252598f9de48159320be55c3d20d703
          path: compiler
      - run: make -C compiler -j2
      - uses: actions/cache@v4
        id: cache
        with:
          path: ${{ runner.temp }}/charm
          key: leanmd-charm-v8.0.0-multicore-ubuntu24-production-v1
      - name: Build Charm++ v8.0.0
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch v8.0.0 https://github.com/charmplusplus/charm.git "$RUNNER_TEMP/charm"
          cd "$RUNNER_TEMP/charm"
          ./build charm++ multicore-linux-x86_64 --with-production -j2
      - name: Compare original and hybrid execution
        run: |
          python3 charmsharp/runtime_check.py --compiler compiler/build/charmsharp --charmc "$RUNNER_TEMP/charm/multicore-linux-x86_64/bin/charmc"
